[project]
name = "youtube_gen"
version = "0.1.0"
description = "youtube-gen using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.100.1,<1.0.0"
]

[project.scripts]
youtube_gen = "youtube_gen.main:run"
run_crew = "youtube_gen.main:run"
train = "youtube_gen.main:train"
replay = "youtube_gen.main:replay"
test = "youtube_gen.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
